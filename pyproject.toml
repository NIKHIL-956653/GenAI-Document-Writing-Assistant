[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docgen"
version = "0.2.0"
description = "Jira ticket -> LLM -> technical document -> Google Docs / Confluence"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nikhil Chandra Sairam Tokala" }]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "markdown>=3.5",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
docgen = "docgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docgen = ["templates/*.yaml", "eval/fixtures/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["docgen"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = [
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "\\.\\.\\.$",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings: the arrows and dashes in messages are intended
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["docgen"]

[tool.mypy]
python_version = "3.10"
files = ["src/docgen"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google_auth_httplib2", "httplib2", "markdown"]
ignore_missing_imports = true
