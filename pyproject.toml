[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docgen"
version = "0.2.0"
description = "Jira ticket -> LLM -> technical document -> Google Docs / Confluence"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nikhil Chandra Sairam Tokala" }]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "markdown>=3.5",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
docgen = "docgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
