name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy

  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The coverage threshold (fail_under) lives in pyproject.toml.
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: always() && matrix.python == '3.12'
        run: |
          {
            echo "## Coverage"
            echo
            coverage report --format=markdown
          } > coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            coverage.xml
            coverage-summary.md
          if-no-files-found: ignore

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the image
        run: docker build -t docgen:ci .
      - name: The API refuses to start without a token
        run: |
          if docker run --rm docgen:ci; then echo "server started without DOCGEN_API_TOKEN"; exit 1; fi
      - name: Smoke test the API
        run: |
          docker run -d --name docgen -p 8000:8000 -e DOCGEN_API_TOKEN="$(openssl rand -hex 32)" docgen:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && exit 0; sleep 1; done
          docker logs docgen; exit 1
      - name: Validate docker-compose.yml
        run: docker compose config -q

  coverage-comment:
    name: coverage comment
    needs: test
    # Fork PRs get a read-only token; they still see the job summary and artifact.
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage
        continue-on-error: true
      - name: Post or update the coverage comment
        if: hashFiles('coverage-summary.md') != ''
        # Third-party action with pull-requests: write, pinned to a commit so a moved
        # or compromised branch or tag can't change what runs. Update the SHA and the version together.
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: coverage
          path: coverage-summary.md
